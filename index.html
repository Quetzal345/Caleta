<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villas Estrellas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand text-orange" href="#" id="brand">Villas Estrellas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">ACERCA DE NOSOTROS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://maps.app.goo.gl/tct4CU7rwyukeGLg6" target="_blank">UBICACIÓN</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">CONTACTO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.airbnb.mx/rooms/48079890?check_in=2025-03-11&check_out=2025-03-14&guests=1&adults=1&s=67&unique_share_id=9d50e39f-a90c-44a8-b834-a567c563d27c" target="_blank">
                            <img src="airbnb.png" alt="Airbnb" width="30" class="social-icon">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.facebook.com/share/15gwzqTbAt/?mibextid=wwXIfr" target="_blank">
                            <img src="facebook.png" alt="Facebook" width="30" class="social-icon">
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sección inicial -->
    <div class="initial-section">
        <div class="container-fluid hero">
            <div class="row">
                <div class="col-12">
                    <img src="Caleta1.jpg" alt="Playa" class="img-fluid hero-image">
                    <div class="hero-text">
                        <h1>Buscando un lugar mágico para relajarte</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sección de fondo con texto -->
    <div class="background-section">
        <div class="background-overlay"></div>
        <div class="background-text">
            <h2>El lugar perfecto para desconectar</h2>
        </div>
    </div>

    <!-- Sección de galería -->
    <section class="gallery-section">
        <div class="container">
            <h2>Esto es lo que te espera</h2>
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="Playa1.jpg" alt="Playa 1" class="img-fluid">
                </div>
                <div class="gallery-item">
                    <img src="playa2.jpg" alt="Playa 2" class="img-fluid">
                </div>
                <div class="gallery-item">
                    <img src="playa3.jpg" alt="Playa 3" class="img-fluid">
                </div>
            </div>
        </div>
    </section>

    <script src="scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
